name: Rust Game CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks-and-webgl:
    name: Check, test, and build WebGL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carriage_run
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: carriage_run

      - name: Checkout pinned macroquad-toolkit
        uses: actions/checkout@v4
        with:
          repository: WebHatchery/macroquad-toolkit
          ref: 1ea59565e144d8da4deffd187bcd6d2bb657b504
          path: macroquad-toolkit

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            carriage_run/target
          key: ${{ runner.os }}-carriage-run-cargo-${{ hashFiles('carriage_run/Cargo.lock', 'carriage_run/Cargo.toml', 'macroquad-toolkit/Cargo.toml', 'carriage_run/toolkit.lock') }}
          restore-keys: |
            ${{ runner.os }}-carriage-run-cargo-

      - name: Verify repository layout and toolkit pin
        shell: bash
        run: |
          test -f Cargo.toml
          test -f Cargo.lock
          test -d assets
          test -f publish.ps1
          test -s catalog_thumbnail.png
          test "$(cat toolkit.lock)" = "$(git -C ../macroquad-toolkit rev-parse HEAD)"

      - name: Check formatting
        run: cargo fmt --manifest-path Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path Cargo.toml --locked --all-features

      - name: Build WebGL release
        shell: bash
        run: |
          export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=source --remap-path-prefix=${CARGO_HOME}=cargo-home -C link-arg=--import-undefined -C link-arg=--allow-undefined"
          cargo build --manifest-path Cargo.toml --locked --release --target wasm32-unknown-unknown

      - name: Verify WebGL output and budget
        shell: bash
        run: |
          wasm_name="$(cargo metadata --manifest-path Cargo.toml --locked --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["packages"][0]["name"].replace("-","_")+".wasm")')"
          test -s "target/wasm32-unknown-unknown/release/${wasm_name}"
          test "$(stat -c%s "target/wasm32-unknown-unknown/release/${wasm_name}")" -le 2500000

  windows-build:
    name: Build Windows release and publisher check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: carriage_run
    steps:
      - name: Checkout game
        uses: actions/checkout@v4
        with:
          path: carriage_run

      - name: Checkout pinned macroquad-toolkit
        uses: actions/checkout@v4
        with:
          repository: WebHatchery/macroquad-toolkit
          ref: 1ea59565e144d8da4deffd187bcd6d2bb657b504
          path: macroquad-toolkit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release
        shell: pwsh
        run: |
          $profile = [Environment]::GetFolderPath("UserProfile")
          $env:CARGO_BUILD_RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=source --remap-path-prefix=$profile=build-user"
          cargo build --manifest-path Cargo.toml --locked --release

      - name: Verify Windows output, icon resource, and publisher entry point
        shell: pwsh
        run: |
          $metadata = cargo metadata --manifest-path Cargo.toml --locked --no-deps --format-version 1 | ConvertFrom-Json
          $bin = @($metadata.packages[0].targets | Where-Object { $_.kind -contains "bin" } | Select-Object -First 1).name
          if (-not $bin) { $bin = $metadata.packages[0].name }
          $exePath = Join-Path "target\release" "$bin.exe"
          if (-not (Test-Path $exePath -PathType Leaf)) { throw "Missing $exePath" }
          if (-not (Test-Path "assets\packaging\carriage_run.ico" -PathType Leaf)) { throw "Missing application icon" }
          if (-not (Test-Path "publish.ps1" -PathType Leaf)) { throw "Missing publisher wrapper" }
          if (-not (Test-Path "Cargo.lock" -PathType Leaf)) { throw "Missing standalone lockfile" }
          if (-not (Test-Path "toolkit.lock" -PathType Leaf)) { throw "Missing toolkit pin" }
          if ((Get-Content -Raw toolkit.lock).Trim() -ne (git -C ..\macroquad-toolkit rev-parse HEAD).Trim()) { throw "Toolkit checkout does not match toolkit.lock" }

      - name: Verify playtest triage safeguards
        shell: pwsh
        run: .\scripts\verify_playtest_triage.ps1

      - name: Verify Steam asset specification safeguards
        shell: pwsh
        run: .\scripts\verify_steam_asset_audit.ps1
